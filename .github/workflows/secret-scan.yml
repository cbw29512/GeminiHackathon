name: Secret Scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan current files and history
        shell: bash
        run: |
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|(^|[^A-Za-z0-9])(AKIA|ASIA)[0-9A-Z]{16}([^A-Za-z0-9]|$)|gh[pousr]_[A-Za-z0-9_]{30,255}|github_pat_[A-Za-z0-9_]{50,255}|xox[baprs]-[A-Za-z0-9-]{20,}|sk-(proj-|ant-)?[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}'
          found=0
          current_matches="$(git grep -I -l -E "$pattern" HEAD -- . || true)"
          sensitive_files="$(git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|credentials\.json|service-account\.json)$|\.(pem|p12|pfx)$' | grep -v -E '\.env\.example$|\.example\.(pem|key)$' || true)"

          if [[ -n "$current_matches" ]]; then
            echo "Potential credential patterns in current files:"
            printf '%s\n' "$current_matches"
            found=1
          fi
          if [[ -n "$sensitive_files" ]]; then
            echo "Sensitive filenames are tracked:"
            printf '%s\n' "$sensitive_files"
            found=1
          fi
          if git log -p --all --no-ext-diff --no-renames --pretty=format: | grep -E -q "$pattern"; then
            echo "Potential credential pattern exists in Git history."
            found=1
          fi
          if [[ "$found" -ne 0 ]]; then
            echo "Rotate real credentials before removing them from Git history."
            exit 1
          fi
          echo "No recognized credential patterns or sensitive filenames detected."
